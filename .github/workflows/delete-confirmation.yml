name: Add delete confirmation

on:
  push:
    branches:
      - feature/delete-confirmation

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add confirmation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_button = 'onclick="deleteItem(${x.id})"'
          new_button = 'onclick="confirmDeleteItem(${x.id})"'
          if old_button not in s:
              raise SystemExit('Delete button pattern not found; no changes made.')
          s = s.replace(old_button, new_button, 1)
          marker = 'async function deleteItem(id){'
          confirmation = '''function confirmDeleteItem(id){
            const item=items.find(x=>x.id===id);
            if(!item)return;
            if(confirm(`Are you sure you want to delete "${item.name}" from your closet?`)) deleteItem(id);
          }
          '''
          if marker not in s:
              raise SystemExit('deleteItem function not found; no changes made.')
          s = s.replace(marker, confirmation + marker, 1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add delete confirmation for closet items'
          git push
